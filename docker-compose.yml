services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stellarhex
      POSTGRES_USER: stellarhex
      POSTGRES_PASSWORD: stellarhex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarhex"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/stellarhex
      KC_DB_USERNAME: stellarhex
      KC_DB_PASSWORD: stellarhex
      KC_HTTP_PORT: 9090
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:9090"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stellarhex
      DB_USER: stellarhex
      DB_PASS: stellarhex
      KEYCLOAK_ISSUER: http://keycloak:9090/realms/stellar-hex
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
