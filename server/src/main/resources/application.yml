server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stellarhex}
    username: ${DB_USER:stellarhex}
    password: ${DB_PASS:stellarhex}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: stellar-hex-app
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:9090/realms/stellar-hex}
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost:9090/realms/stellar-hex/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:9090/realms/stellar-hex/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost:9090/realms/stellar-hex/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:9090/realms/stellar-hex/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.stellarhex: DEBUG
